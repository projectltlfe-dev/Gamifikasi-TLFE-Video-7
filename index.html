<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gamifikasi Video 7 TLFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--b:#2563C9;--b2:#3B7BE0;--bD:#163F86;--r:#E2353C;--sun:#FFC93C;--cream:#FFF8EA;--ink:#1F2A3A;--mut:#7B8798;--ok:#16A35C;--no:#E5533D;
  --fd:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--fn:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;overflow:hidden;background:#7cc66a}
body{font-family:var(--fn);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- dunia: latar menyambung di atas & bawah stage ---------- */
#app{position:relative;width:100%;height:100%;overflow:hidden}
#world{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#world>div{position:absolute;left:0;right:0}
.w-sky{top:0;background:linear-gradient(180deg,#3F98DB 0%,#79C2EE 55%,#C9ECFA 100%)}
.w-skyline{background-repeat:repeat-x;opacity:.95}
.w-road{background:linear-gradient(180deg,#D9DFE8 0 9.4%,#AEB7C4 9.4% 10.6%,#4A5263 10.6% 89.4%,#AEB7C4 89.4% 90.6%,#D9DFE8 90.6%)}
.w-road i{position:absolute;left:0;right:0;background-image:linear-gradient(90deg,#F4F6F8 0 50%,transparent 50%);background-repeat:repeat-x}
.w-grass{bottom:0;background-color:#7CC66A;background-image:radial-gradient(circle at 30% 40%,#8FD27A 0 18%,transparent 19%),radial-gradient(circle at 75% 75%,#6DB75C 0 12%,transparent 13%)}
.w-cloud{position:absolute;height:22px;border-radius:20px;background:#fff;opacity:.9;animation:drift linear infinite;transform-origin:0 0}
.w-cloud::before,.w-cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.w-cloud::before{width:26px;height:26px;left:10px;top:-12px}.w-cloud::after{width:18px;height:18px;left:30px;top:-7px}
@keyframes drift{from{left:-120px}to{left:calc(100% + 40px)}}

#stage{position:absolute;left:0;top:0;width:360px;height:640px;overflow:visible;transform-origin:0 0;z-index:1}
#scene.off{visibility:hidden}
.layer{position:absolute;inset:0}
#scene{z-index:1}
#scene svg.fg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#scene .hs{transition:transform .4s var(--spring)}
#scene .hs .ok,#scene .hs .pin{transition:opacity .3s}
#scene .hs.cur .pin{opacity:1;animation:pinb 1s ease-in-out infinite}
#scene .hs.dn .ok{opacity:1}
#scene .hs.dn .win{fill:#FFE27A}
@keyframes pinb{50%{transform:translateY(-4px)}}
#mini{transition:transform 1.4s cubic-bezier(.45,0,.3,1)}
#raka{position:absolute;left:-8px;top:56px;height:206px;width:auto;transform-origin:50% 100%;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.14))}
#raka.jump{animation:jump .5s 2}#raka.nod{animation:nod .7s}#raka.sway{animation:sway 1.4s ease-in-out infinite}#raka.sad{animation:sad .9s forwards}
@keyframes jump{50%{transform:translateY(-12px) scale(1.02,.98)}}
@keyframes nod{50%{transform:rotate(2.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes sad{to{transform:rotate(-3deg) scale(.98);filter:saturate(.55) drop-shadow(0 4px 0 rgba(0,0,0,.14))}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:50px;z-index:30;display:flex;align-items:center;gap:5px;padding:8px 58px 8px 8px;transition:transform .5s var(--smooth),opacity .4s}
#hud.hide{transform:translateY(-120%);opacity:0}
.lt{width:28px;height:32px;border-radius:10px;background:#fff;color:#b9c3cf;font:700 15px/32px var(--fd);text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:background .3s,color .3s}
.lt.on{background:var(--sun);color:var(--ink);animation:ltp 1s ease-in-out infinite}
.lt.dn{background:var(--ok);color:#fff}
@keyframes ltp{50%{transform:translateY(-2px)}}
#star{margin-left:auto;background:#fff;border-radius:10px;padding:0 9px;height:32px;display:flex;align-items:center;gap:3px;font:700 15px var(--fd);color:#B07A00;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#bgmBtn{position:absolute;right:8px;top:8px;z-index:68;width:42px;height:34px;border-radius:11px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);display:grid;place-items:center;transition:transform .12s}
#bgmBtn:active{transform:translateY(3px);box-shadow:none}
#bgmBtn svg{width:28px;height:24px}
#bgmBtn .eq rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate}
#bgmBtn .eq rect:nth-child(2){animation-delay:.25s}#bgmBtn .eq rect:nth-child(3){animation-delay:.5s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#bgmBtn .x{display:none}#bgmBtn.off .eq{display:none}#bgmBtn.off .x{display:inline}

/* ---------- bubble Raka ---------- */
#bub{position:absolute;left:112px;top:56px;width:240px;z-index:20;background:#fff;border-radius:18px;padding:22px 13px 14px;font:800 13px/1.42 var(--fn);color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.08),0 10px 24px rgba(20,40,80,.25);opacity:0;transform:scale(.6);transform-origin:0 40px;pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
#bub.show{opacity:1;transform:none}
#bub::before{content:'';position:absolute;left:-7px;top:34px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
#bub .who{position:absolute;top:-11px;left:10px;display:flex;align-items:center;gap:5px;background:var(--b);color:#fff;font:600 12px var(--fd);padding:3px 11px 3px 4px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
#bub .who em{font:800 8px var(--fn);font-style:normal;background:rgba(255,255,255,.22);padding:2px 6px;border-radius:999px;letter-spacing:.4px}
.av{width:22px;height:22px;border-radius:50%;background-color:#E6EEFB;background-image:var(--raka);background-size:80px auto;background-position:-29px -11px;background-repeat:no-repeat;flex:none}
#bub b{color:var(--b)}
#bub .nx{position:absolute;right:10px;bottom:3px;font-size:10px;color:#9fb0c5;opacity:0}
#bub .nx.on{opacity:1;animation:nudge .7s ease-in-out infinite alternate}
@keyframes nudge{to{transform:translateY(3px)}}
#bub.live .nx{display:none}
.ch{opacity:0}.ch.on{opacity:1}

/* ---------- panel permainan ---------- */
#panel{position:absolute;left:8px;right:8px;top:268px;height:346px;z-index:10;background:var(--cream);border-radius:20px;border:3px solid #E6D6B0;
  box-shadow:0 5px 0 #C9B48A,0 12px 26px rgba(0,0,0,.2);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;
  opacity:0;transform:translateY(30px) scale(.96);pointer-events:none;transition:opacity .35s,transform .45s var(--spring)}
#panel.show{opacity:1;transform:none;pointer-events:auto}
.ph{display:flex;align-items:center;gap:6px;min-height:26px}
.tag{flex:none;background:var(--b);color:#fff;font:700 11px var(--fd);padding:4px 9px;border-radius:999px;letter-spacing:.3px}
.pi{flex:1;display:flex;align-items:center;gap:6px;font:800 11.5px/1.25 var(--fn);color:var(--bD);min-width:0}
.pi i{flex:none;font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font:700 11px var(--fd);color:var(--ink)}
.pi b{color:var(--r)}
.cnt{flex:none;font:700 11px var(--fd);color:#6E4A1F;background:#F3E6CC;border-radius:999px;padding:3px 8px;white-space:nowrap}
.prow{display:flex;align-items:center;gap:8px;min-height:40px}
.pt{flex:1;font:800 11.5px/1.3 var(--fn);color:#6b5a45;min-height:28px;display:flex;align-items:center}
.pt.good{color:var(--ok)}.pt.bad{color:var(--no)}
.pt b{color:var(--b)}
.bt{flex:none;background:var(--b);color:#fff;border-radius:14px;padding:0 16px;height:42px;font:700 15px var(--fd);box-shadow:0 4px 0 var(--bD);transition:transform .1s,box-shadow .1s,filter .2s,opacity .2s}
.bt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bD)}
.bt[disabled]{filter:grayscale(1);opacity:.45;pointer-events:none}
.bt.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #C58F00}
.bt.sun:active{box-shadow:0 1px 0 #C58F00}
.bt.wide{width:100%;height:48px;font-size:17px}
.bt.pulse{animation:btp 1s ease-in-out infinite}
@keyframes btp{50%{transform:scale(1.06)}}
.sv{width:100%;flex:1;min-height:0;display:block;touch-action:none;border-radius:12px}

/* ride */
.trk{flex:1;position:relative;height:16px;background:#EFE3C9;border-radius:9px}
.trk i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7FB6FF,var(--b));border-radius:9px}
.trk b{position:absolute;top:50%;left:0;font-size:18px;line-height:1;transform:translate(-50%,-55%)}
.trk span{position:absolute;right:-6px;top:50%;font-size:18px;line-height:1;transform:translateY(-55%)}

/* pintu konsumen */
.door{flex:none;height:106px;display:flex;gap:8px;align-items:stretch;border-radius:14px;padding:6px;background:linear-gradient(180deg,#FBE7C6,#F3D6A6);border:2px solid #E3C38C;transition:box-shadow .2s,background .2s}
.door.hot{background:linear-gradient(180deg,#FFF3C4,#FFE08A);box-shadow:0 0 0 3px var(--sun)}
.door.shk{animation:shk .4s}
.frame{flex:none;width:88px;position:relative;border-radius:10px 10px 4px 4px;background:#3A2A1E;border:4px solid #8A5A34;border-bottom:0;overflow:hidden}
.frame .boss{position:absolute;left:50%;bottom:12px;width:76px;height:84px;transform:translateX(-50%)}
.frame .boss svg{width:100%;height:100%;display:block}
.frame .plate{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--sun);font:700 10.5px/16px var(--fd);text-align:center;color:var(--ink);white-space:nowrap}
.quote2{flex:1;position:relative;background:#fff;border-radius:12px;padding:8px 9px 7px;display:flex;flex-direction:column;justify-content:center;gap:3px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.quote2::before{content:'';position:absolute;left:-6px;top:42px;width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:2px}
.quote2 .qw{align-self:flex-start;font:800 9.5px var(--fn);color:#fff;background:var(--b2);padding:2px 8px;border-radius:999px;position:relative}
.quote2 p{font:800 12px/1.35 var(--fn);color:var(--ink);position:relative}
.quote2 p.ans{color:var(--ok);font-size:12.5px}
.quote2 p.ans.bad{color:var(--no)}
.bagh{flex:none;font:800 10.5px var(--fn);color:#6b5a45;display:flex;align-items:center;gap:4px}
.bagh b{color:var(--b)}
.bag{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pk{position:relative;width:calc(33.333% - 4px);height:54px;border-radius:9px;background:linear-gradient(180deg,#E9BC86,#D19C5F);border:2px solid #B07A43;box-shadow:0 3px 0 #9A6633;
  padding:10px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;touch-action:none;transition:transform .15s,opacity .25s,filter .25s}
.pk::before{content:'';position:absolute;left:50%;top:-2px;width:16px;margin-left:-8px;height:12px;background:#F4E4B8;border-radius:0 0 2px 2px;opacity:.95}
.pk b{font:700 11.5px/1.1 var(--fd);color:#3D2A14;position:relative}
.pk span{font:800 8.5px var(--fn);color:#fff;background:var(--c);border-radius:999px;padding:1px 6px;white-space:nowrap;position:relative}
.pk:active{transform:scale(.96)}
.pk.x{filter:grayscale(1);opacity:.45;pointer-events:none}
.pk.x::after{content:'✗';position:absolute;right:4px;top:0;font:700 16px var(--fd);color:var(--no)}
.pk.lift{opacity:.25}
.pk.ghost{position:absolute;width:104px;z-index:5;pointer-events:none;box-shadow:0 10px 18px rgba(0,0,0,.3);transform:rotate(-4deg) scale(1.05)}
@keyframes shk{25%{translate:-4px 0}75%{translate:4px 0}}

/* manifes order */
.mf{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0}
.mf div{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #EADBB8;border-radius:12px;padding:4px 8px;flex:1}
.mf svg{width:30px;height:28px;flex:none}
.mf b{font:700 13px var(--fd);flex:1}
.mf small{font:800 9.5px var(--fn);color:var(--mut);background:#F3EBDA;border-radius:999px;padding:2px 8px}
/* kartu level terbuka */
.clear{position:absolute;inset:0;z-index:5;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:12px 16px}
.clear .unl{font:800 11px var(--fn);color:var(--mut);letter-spacing:1.2px}
.clear .big{display:flex;align-items:center;gap:10px}
.clear .big b{width:50px;height:50px;border-radius:16px;background:var(--c);color:#fff;font:700 30px/50px var(--fd);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.clear .big span{font:700 22px/1.1 var(--fd);color:var(--bD);text-align:left}
.clear .big small{display:block;font:800 11px var(--fn);color:var(--mut)}
.clear .stars{font-size:26px;letter-spacing:4px;line-height:1}
.clear .stars i{font-style:normal;display:inline-block}
.clear .bon{font:800 10.5px var(--fn);color:#0d6a3b;background:#DFF5E8;border-radius:999px;padding:3px 10px}
.clear .q{font:700 13.5px/1.25 var(--fd);color:#6E4A1F;background:#F3E6CC;border-radius:12px;padding:6px 12px}
.clear p{font:800 12.5px/1.45 var(--fn);color:#4b4033}
.clear p b{color:var(--b)}

/* ---------- overlay ---------- */
#ui{z-index:40;pointer-events:none}
#ui>*{pointer-events:auto}
#ui>.caption{pointer-events:none}
.backdrop{position:absolute;inset:-1600px;background:rgba(15,30,60,.55);backdrop-filter:blur(2px)}
.card{position:absolute;left:12px;right:12px;background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.3);overflow:auto;-webkit-overflow-scrolling:touch}
.caption{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%) rotate(-2deg);background:var(--sun);color:var(--ink);font:700 20px/1.15 var(--fd);padding:10px 20px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.15);text-align:center;white-space:nowrap;z-index:50}
.caption small{display:block;font:800 10px var(--fn);letter-spacing:1.5px;opacity:.7}

/* briefing */
.start{position:absolute;inset:0;overflow:visible}
.start .rays{position:absolute;left:50%;top:250px;width:900px;height:900px;margin:-450px;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg,transparent 10deg 20deg);animation:spin 70s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,#000 90px,transparent 260px);mask-image:radial-gradient(circle,#000 0,#000 90px,transparent 260px)}
@keyframes spin{to{transform:rotate(360deg)}}
.start .fl{position:absolute;font-size:22px;opacity:.55;animation:float 4s ease-in-out infinite alternate}
@keyframes float{from{translate:0 0;rotate:-8deg}to{translate:0 -10px;rotate:8deg}}
.sTitle{position:absolute;left:0;right:0;top:34px;text-align:center;color:#fff}
.sTitle .chipM{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);font:700 12px var(--fd);padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sTitle h1{font:700 44px/1 var(--fd);margin-top:10px;text-shadow:0 4px 0 rgba(15,50,110,.45);letter-spacing:.5px}
.sTitle h1 span{color:var(--sun)}
.sTitle p{font:800 13px/1.35 var(--fn);color:#fff;margin-top:6px;text-shadow:0 2px 0 rgba(15,50,110,.45)}
.sRaka{position:absolute;left:50%;top:150px;height:250px;transform:translateX(-50%);filter:drop-shadow(0 8px 0 rgba(15,40,80,.22))}
.sCard{position:absolute;left:14px;right:14px;bottom:28px;background:#fff;border-radius:22px;padding:15px 16px 13px;box-shadow:0 6px 0 rgba(0,0,0,.15),0 16px 36px rgba(0,0,0,.3);z-index:2}
.sCard label{display:block;font:700 15px var(--fd);margin-bottom:6px}
.sapa{display:flex;gap:6px;margin-bottom:10px}
.sapa button{flex:1;height:38px;border-radius:12px;background:#F1F4F8;border:2.5px solid #DCE3EC;font:700 15px var(--fd);color:#5d6b7d;transition:all .2s}
.sapa button.on{background:#E4EEFC;border-color:var(--b);color:var(--b);transform:translateY(-2px);box-shadow:0 3px 0 var(--b)}
.sCard input{width:100%;height:44px;border:2.5px solid #DCE3EC;border-radius:13px;padding:0 13px;font:800 16px var(--fn);color:var(--ink);background:#F7F9FC;outline:none;transition:border-color .2s}
.sCard input:focus{border-color:var(--b);background:#fff}
.sCard .pv{font:800 11px var(--fn);color:var(--mut);margin:6px 2px 0;min-height:15px}
.sCard .pv b{color:var(--b)}
.sCard .bt{margin-top:8px}
.sCard .snd{text-align:center;font:800 10px var(--fn);color:#9aa5b3;margin-top:8px}

/* debrief */
.deb{top:8px;bottom:26px;padding:10px 12px 12px;text-align:center}
.deb .top{display:flex;align-items:center;gap:10px;text-align:left}
.deb .top .av{width:52px;height:52px;background-size:190px auto;background-position:-70px -27px;border:3px solid #E4EEFC}
.deb .chipM{display:inline-block;background:var(--ok);color:#fff;font:700 10px var(--fd);padding:2px 9px;border-radius:999px;letter-spacing:.5px}
.deb h2{font:700 19px/1.15 var(--fd);color:var(--bD);margin-top:3px}
.score{display:flex;align-items:center;gap:8px;background:#FFF8E6;border-radius:12px;padding:5px 10px;margin:7px 0 5px}
.score b{font:700 17px var(--fd);color:#B07A00;white-space:nowrap}
.score .tr{flex:1;height:10px;background:#F0E3C3;border-radius:6px;overflow:hidden}
.score .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC93C,#F28C28);border-radius:6px;transition:width 1.3s var(--smooth) .4s}
.deb .lead{font:800 11px/1.3 var(--fn);color:#4b4033;margin-bottom:5px}
.deb .lead b{color:var(--b)}
.gr{display:grid;gap:4px;text-align:left}
.gr>div{display:flex;gap:8px;background:#F2F6FC;border-radius:11px;padding:5px 8px;align-items:flex-start}
.gr .L{flex:none;width:28px;height:28px;border-radius:9px;background:var(--c);color:#fff;font:700 16px/28px var(--fd);text-align:center}
.gr h4{font:700 12px var(--fd);display:flex;justify-content:space-between;gap:6px;color:var(--ink)}
.gr h4 small{font:800 10px var(--fn);color:#B07A00;white-space:nowrap}
.gr p{font:800 9.5px/1.3 var(--fn);color:#4f5e70}
.gr p em{font-style:normal;color:var(--b)}
.quote{margin-top:6px;background:var(--bD);color:#fff;border-radius:12px;padding:8px 11px;font:800 11px/1.4 var(--fn);text-align:left}
.quote b{color:var(--sun)}
.deb .bt{margin-top:7px;height:42px}
.d2 h3{font:700 16px/1.2 var(--fd);color:var(--bD);margin:6px 0 2px}
.d2 .sub{font:800 11px/1.35 var(--fn);color:#4b4033;margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.two>div{border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.two .t1{background:#E8F0FD;border:2px solid #A9C4F0}.two .t2{background:#E3F6EA;border:2px solid #9ED7B1}
.two i{font-style:normal;font-size:20px;line-height:1}
.two small{font:800 9.5px/1.25 var(--fn);color:var(--mut)}
.two b{font:700 12px/1.2 var(--fd);color:var(--ink)}
.two span{font:800 10px/1.3 var(--fn);color:#4b4033}
.flow{display:flex;align-items:stretch;gap:3px;margin:6px 0 2px}
.flow div{flex:1;background:var(--b);color:#fff;border-radius:9px;padding:5px 3px;font:700 10px/1.15 var(--fd);display:flex;align-items:center;justify-content:center;text-align:center}
.flow em{font-style:normal;color:var(--b);font:700 12px var(--fd);align-self:center}
.lbl2{font:800 9.5px var(--fn);color:var(--mut);letter-spacing:.8px;margin-top:8px;text-align:left}
.own{margin-top:7px;background:#FFF8E6;border-radius:12px;padding:7px 10px;font:800 10.5px/1.4 var(--fn);color:#4b4033;text-align:left}
.own b{color:#B0571F}
.note{margin-top:6px;font:800 10px/1.35 var(--fn);color:var(--mut);text-align:left}
.note b{color:var(--b)}

/* ---------- efek ---------- */
#fx{z-index:60;pointer-events:none}
#hint{position:absolute;left:0;top:0;width:0;height:0;display:none;z-index:2}
#hint .rp{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,201,.45);animation:rp 1.2s ease-out infinite}
#hint .hd{position:absolute;left:-9px;top:-2px;width:42px;height:42px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));animation:press 1.2s ease-in-out infinite}
#hint.drag .rp{display:none}#hint.drag .hd{animation:none}
@keyframes rp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes press{0%,100%{transform:translate(6px,8px)}40%{transform:translate(0,0) scale(.92)}}
.conf{position:absolute;left:0;top:0;font-size:16px;line-height:1}
.ftx{position:absolute;font:700 15px var(--fd);white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
#wipe{position:absolute;inset:0;z-index:70;pointer-events:none}
#wipe.on{pointer-events:auto}
#wipe i{position:absolute;left:50%;top:50%;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;transform:scale(0)}
#wipe .w1{background:var(--sun)}#wipe .w2{background:var(--b)}
#wipe .wl{position:absolute;left:50%;top:50%;font-size:64px;transform:translate(-50%,-50%) scale(0);opacity:0}
#copy{position:absolute;left:0;right:0;bottom:6px;text-align:center;z-index:66;pointer-events:none}
#copy span{display:inline-block;font:700 9px var(--fn);color:rgba(255,255,255,.96);background:rgba(15,40,80,.5);padding:2px 9px;border-radius:999px;letter-spacing:.2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

const Snd=(()=>{

             76,-1,76,77,79,-1,76,-1, 72,-1,72,74,76,-1,72,-1, 77,-1,76,74,72,-1,69,-1, 71,-1,72,74,71,-1,67,-1];
  function stab(f,t,v,dest){const o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();o.type='square';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=1800;
    o.connect(lp);lp.connect(g);g.connect(dest);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.start(t);o.stop(t+.15)}

    o.connect(lp);lp.connect(g);g.connect(mus);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}

  const T=(f,d,o={})=>{if(!ctx)return;tone(f,ctx.currentTime+(o.t||0),d,o.v??.12,o.type||'sine',null,.008,o.to)};

  const D=t=>t<T-.8?V*t:V*(T-.8)+V*.8*((t-(T-.8))/.8-((t-(T-.8))/.8)**2/2);

  let jumpAt=-9,hits=0,t0=null,done=false,airH=0,firstHinted=false;
  const doJump=e=>{if(e){e.preventDefault()}if(done||t0==null)return;const t=(performance.now()-t0)/1000;if(t-jumpAt<.66)return;jumpAt=t;SFX.jump();hintOff();
    if(first&&!firstHinted){firstHinted=true}};

      w1.setAttribute('transform',`translate(0 ${-airH}) rotate(${d*2.4} 12 -11)`);w2.setAttribute('transform',`translate(0 ${-airH}) rotate(${d*2.4} 62 -11)`);
      obs.forEach(ob=>{const x=BX+40+(ob.d-d);ob.g.setAttribute('transform',`translate(${x} ${ob.type==='hole'?214:222})`);
        if(!ob.hit&&!ob.passed&&Math.abs(x-(BX+40))<16){if(airH<8){ob.hit=true;hits++;SFX.bump();
            bk.animate([{transform:'translate(70px,222px) rotate(0)'},{transform:'translate(70px,222px) rotate(-5deg)'},{transform:'translate(70px,222px) rotate(4deg)'},{transform:'translate(70px,222px) rotate(0)'}],{duration:380});

        if(x<BX+40-16&&!ob.passed){ob.passed=true;if(!ob.hit){const r=rectStage(svg),k=r.w/344;floatText(r.x+(BX+40)*k,r.y+110*k,'Mulus! ✨','#16A35C')}}});

async function handover(o,idx,left){
  const lv=LV[o.lv-1];
  openPanel(head(`📦 ORDER ${idx+1}`,'2','**Serahkan paket** yang pas',`🏠 ${o.boss}`)+
   `<div class="door" id="dr"><div class="frame"><div class="boss" id="bs">${person(o.look,'n')}</div><div class="plate">${esc(o.boss)}</div></div>
     <div class="quote2"><span class="qw">💬 ${esc(o.f)} · tim ${esc(o.boss)}</span><p id="qq">${esc(o.q)}</p></div></div>
    <div class="bagh">🎒 Bagasi motor: <b>Tarik</b> atau <b>ketuk</b> paket yang pas</div>
    <div class="bag" id="bag">${left.map(n=>{const L=LV[n-1];return`<button class="pk" data-n="${n}" style="--c:${L.c}" aria-label="Paket: ${L.d} (${L.k})"><b>${L.d}</b><span>${L.n} · ${L.k==='People Development'?'People <br> Development':L.k}</span></button>`}).join('')}</div>
    <div class="prow"><div class="pt" id="pt">Kenapa ${esc(o.f)} mau ikut ${esc(o.boss)}? Pilih paketnya.</div></div>`);
  const dr=$('#dr'),bs=$('#bs'),qq=$('#qq'),pks=$$('.pk',panel);
  let tries=0,busy=false;
  const showHint=()=>{const bg=$('#bag');if(bg)hintDrag(bg,bs)};
  hintLater(showHint,idx===0?900:5000);
  const overDoor=(cx,cy)=>{const r=dr.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top-10&&cy<=r.bottom+10};
  return new Promise(res=>{
    const deliver=async(pk,fromRect)=>{
      if(busy)return;busy=true;hintOff();const n=+pk.dataset.n;tries++;
      const a=fromRect||rectStage(pk),b=rectStage(bs);
      const g=pk.cloneNode(true);g.classList.add('ghost');g.classList.remove('lift');fx.appendChild(g);pk.classList.add('lift');
      SFX.pop();

      SFX.thud();

      bs.innerHTML=person(o.look,'s');dr.classList.remove('shk');void dr.offsetWidth;dr.classList.add('shk');SFX.no();raka('nod');

      g.remove();pk.classList.remove('lift');pk.classList.add('x');

    pks.forEach(pk=>{
      let st=null,ghost=null,moved=false;
      pk.addEventListener('pointerdown',e=>{if(busy||pk.classList.contains('x'))return;e.preventDefault();try{pk.setPointerCapture(e.pointerId)}catch(_){}
        st={x:e.clientX,y:e.clientY,id:e.pointerId,r:rectStage(pk)};moved=false});
      pk.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
        if(!moved&&Math.hypot(dx,dy)>7){moved=true;hintOff();ghost=pk.cloneNode(true);ghost.classList.add('ghost');fx.appendChild(ghost);pk.classList.add('lift');SFX.tap()}
        if(moved){const p=ptStage(e.clientX,e.clientY);ghost.style.transform=`translate(${p.x-52}px,${p.y-30}px) rotate(-4deg) scale(1.05)`;dr.classList.toggle('hot',overDoor(e.clientX,e.clientY))}});
      const end=e=>{if(!st||e.pointerId!==st.id)return;const was=moved;const s0=st;st=null;dr.classList.remove('hot');
        if(!was){deliver(pk);return}
        const p=ptStage(e.clientX,e.clientY),fr={x:p.x-52,y:p.y-30,w:104,h:54};ghost.remove();ghost=null;
        if(e.type!=='pointercancel'&&overDoor(e.clientX,e.clientY))deliver(pk,fr);
        else{pk.classList.remove('lift');SFX.tap();msg('Tarik paketnya sampai ke pintu **'+o.boss+'**, atau cukup ketuk paketnya.');hintLater(showHint,2500)}};
      pk.addEventListener('pointerup',end);pk.addEventListener('pointercancel',end);
      pk.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!busy){e.preventDefault();e.stopPropagation();deliver(pk)}});
    });
  });
}

/* ---------- kartu level terbuka ---------- */
function stageClear(o,idx,stars,bon){const L=LV[o.lv-1];return new Promise(res=>{
  const c=h('div','clear',`<div class="unl">🔓 LEVEL TERBUKA</div><div class="big" style="--c:${L.c}"><b>${L.n}</b><span>${L.k}<small>${L.sub}</small></span></div>
   <div class="stars">${[0,1,2].map(k=>`<i>${k<stars?'⭐':'☆'}</i>`).join('')}</div>${bon?'<div class="bon">🛵 +1 ⭐ bonus jalan mulus</div>':''}
   <div class="q">❓ Kenapa ${esc(o.f)} mau ikut ${esc(o.boss)}?</div><p>${fmt(o.ex)}</p>
   <button class="bt wide">${idx<4?'Order berikutnya ▶':'Lihat hasil ▶'}</button>`,panel);
  c.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:400,easing:'cubic-bezier(.34,1.56,.64,1)'});
  $$('.stars i',c).forEach((e,k)=>e.animate([{transform:'scale(0) rotate(-90deg)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:450,delay:300+k*180,fill:'backwards'}));
  hintLater(()=>hintTap($('.bt',c)),2600);
  $('.bt',c).onclick=()=>{hintOff();SFX.tap();res()}})}

/* =================== BRIEFING AWAL =================== */
function startScreen(){return new Promise(res=>{
  setHud(false);
  const s=h('div','start',`<div class="rays"></div>
    <div class="sTitle"><span class="chipM">📦 Paket Pemimpin · Video 7</span><h1>Paket <span>Pemimpin</span></h1><p>Mengapa Orang Mengikuti Kita?</p></div>
    <img class="sRaka" alt="Raka">
    <div class="sCard"><label>Halo! Mau dipanggil apa?</label>
      <div class="sapa">${['Bapak','Ibu'].map(x=>`<button data-v="${x}">${x}</button>`).join('')}</div>
      <input id="nm" maxlength="16" autocomplete="off" placeholder="Tulis nama panggilan..." enterkeyhint="go" aria-label="Nama panggilan">
      <div class="pv" id="pv">Pilih sapaan, lalu tulis nama panggilan.</div>
      <button class="bt wide" id="go" disabled>Mulai Gamifikasi ▶</button>
      <div class="snd">🎧 Nyalakan suara biar makin seru</div></div>`,ui);
  $('.sRaka',s).src=IMG;
  for(let i=0;i<8;i++){const f=h('span','fl',['📦','🛵','✨','⭐'][i%4],s);f.style.left=rand(4,330)+'px';f.style.top=rand(110,330)+'px';f.style.animationDelay=(-rand(0,4))+'s'}
  $('.sTitle',s).animate([{opacity:0,transform:'translateY(-30px) scale(.9)'},{opacity:1,transform:'none'}],{duration:700,easing:'cubic-bezier(.34,1.56,.64,1)'});
  $('.sRaka',s).animate([{transform:'translateX(-50%) translateY(220px)'},{transform:'translateX(-50%) translateY(-10px)',offset:.7},{transform:'translateX(-50%)'}],{duration:900,delay:200,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  $('.sCard',s).animate([{opacity:0,transform:'translateY(80px)'},{opacity:1,transform:'none'}],{duration:700,delay:400,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  const inp=$('#nm',s),go=$('#go',s),pv=$('#pv',s);
  const upd=()=>{const n=inp.value.trim().replace(/\s+/g,' ');go.disabled=!(n&&S.sapa);
    pv.innerHTML=S.sapa&&n?`Raka akan memanggil <b>${esc(S.sapa+' '+n)}</b> 👋`:!S.sapa?'Pilih sapaan: Bapak atau Ibu.':'Sekarang tulis nama panggilan.'};
  $$('.sapa button',s).forEach(b=>b.onclick=()=>{S.sapa=b.dataset.v;$$('.sapa button',s).forEach(x=>x.classList.toggle('on',x===b));SFX.pop();upd();if(!inp.value.trim())inp.focus()});
  inp.addEventListener('input',upd);
  const start=async()=>{const n=inp.value.trim().replace(/\s+/g,' ');if(!n||!S.sapa)return;S.name=n.slice(0,16);inp.blur();Snd.init();SFX.win();
    await wipe(async()=>{s.remove();fit(true)});res()};
  go.onclick=start;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start()}});
})}

/* =================== DEBRIEF =================== */
function sendComplete(){try{
    window.parent.postMessage("scoreBarFound", "*");
    window.top.postMessage("scoreBarFound", "*");
  }catch(e){}}
function debrief(){
  const tot=S.stars.reduce((a,b)=>a+b,0)+S.bonus;setHud(false);hideBub();
  const bd=h('div','backdrop','',ui);bd.animate([{opacity:0},{opacity:1}],{duration:300});
  const show=(html,cls)=>{const c=h('div','card deb '+(cls||''),html,ui);
    c.animate([{opacity:0,transform:'translateY(60px) scale(.95)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'});
    [...c.children].forEach((e,i)=>e.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:420,delay:220+i*80,fill:'backwards'}));return c};
  const byLv=LV.map(L=>ORD.find(o=>o.lv===L.n));
  const c1=show(`<div class="top"><span class="av"></span><div><span class="chipM">✓ SEMUA PAKET TERKIRIM</span><h2>Hebat, ${esc(P())}!</h2><div style="font:800 11px var(--fn);color:var(--mut)">5 atasan sudah menerima paketnya 📦</div></div></div>
    <div class="score"><b>⭐ ${tot} / 20</b><div class="tr"><i></i></div></div>
    <div class="lead">Alasan tim mau ikut leader-nya bisa beda-beda. Ini <b>5 Level Kepemimpinan</b> dari John C. Maxwell:</div>
    <div class="gr">${LV.map((L,i)=>{const o=byLv[i],k=ORD.indexOf(o);return`<div style="--c:${L.c}"><span class="L">${L.n}</span><div style="flex:1"><h4>${L.k} · ${L.sub}<small>${'⭐'.repeat(S.stars[k])}${'☆'.repeat(3-S.stars[k])}</small></h4><p>${esc(L.rc)}<br><em>Di jalan:</em> ${esc(o.f)} → ${esc(o.boss)}</p></div></div>`}).join('')}</div>
    <div class="quote">Level kepemimpinan <b>nggak ada kaitannya sama jabatan</b>. Yang jadi ukuran: <b>Alasan kenapa tim mau ikut kita</b>.</div>
    <button class="bt wide" id="nx2">Lanjut ▶</button>`);
  setTimeout(()=>{$('.score .tr i',c1).style.width=(tot/20*100)+'%'},50);
  setTimeout(()=>{SFX.win();burst(40)},500);
  sendComplete();
  hintLater(()=>hintTap($('#nx2')),4500);
  $('#nx2').onclick=async()=>{hintOff();SFX.tap();
    await c1.animate([{opacity:1},{opacity:0,transform:'translateX(-40px)'}],{duration:260,fill:'forwards'}).finished.catch(()=>{});c1.remove();
    show(`<span class="chipM" style="background:var(--b)">💡 SATU HAL PENTING</span>
      <h3>5 level ini lensa, bukan anak tangga</h3>
      <div class="sub">Memimpin pakai jabatan itu wajar, karena setiap leader memang dikasih jabatan & kewenangan.</div>
      <div class="two">
        <div class="t1"><i>🪪</i><small>Titik berangkat</small><b>Jabatan (Position)</b><span>Sah dan wajar. Tapi jangan berhenti di situ.</span></div>
        <div class="t2"><i>🤝</i><small>Yang bikin tim mau ikut</small><b>Alasan selain jabatan</b><span>Hubungan kerja, hasil kerja, dan tim yang berkembang.</span></div>
      </div>
      <div class="lbl2">COBA REFLEKSI KESEHARIAN KITA</div>
      <div class="flow"><div>Dengerin tim</div><em>›</em><div>Bantu kasih solusi</div><em>›</em><div>Kembangkan tim</div><em>›</em><div>Konsisten</div></div>
      <div class="own">Jangan sampai alasan tim ikut kita <b>cuma karena kita atasannya</b>. Untuk jadi leader hebat, ga perlu muluk-muluk ngejar Pinnacle dulu. Tim ikut karena lihat <b>hasil kerja</b> atau karena kita <b>kembangkan</b>, itu udah bagus banget.</div>
      <div class="note">Rasa hormat nggak bisa diminta dan nggak instan. Butuh <b>waktu dan konsistensi</b>. Sampai ketemu di video berikutnya: <b>CARE</b>! 👋</div>
      <button class="bt wide" id="again">↺ Ulangi Gamifikasi</button>`,'d2');
    $('#again').onclick=()=>{SFX.tap();location.reload()};
  };
}

/* =================== ALUR UTAMA =================== */
async function main(){
  buildScene();scene.classList.add('off');
  await startScreen();
  scene.classList.remove('off');setHud(true);setSlots(-1);
  S.order=shuffle(ORD.map((_,i)=>i));
  $('#raka').animate([{transform:'translateX(-130%)'},{transform:'translateX(6%)',offset:.75},{transform:'none'}],{duration:800,easing:'cubic-bezier(.22,1,.36,1)'});
  await sleep(700);
  await say('Halo, {p}! Salam kenal, saya **Raka**. Hari ini saya mau mengantar paket, yuk bantu saya!','jump',true);
  manifest();
  await say('Hari ini ada **5 paket** buat **5 atasan**. Isinya: Alasan kenapa timnya mau ikut sama atasan itu.','nod');
  await say('Tugas {p}: Antar pakai motor, dengar kata timnya, lalu **serahkan paket yang pas**. 🛵','jump');
  closePanel();await sleep(300);
  let left=[1,2,3,4,5];
  for(let idx=0;idx<5;idx++){
    const k=S.order[idx],o=ORD[k];
    setSlots(idx);setTarget(k);moveMini(k);
    await caption(`Order #${idx+1}`,`🏠 RUMAH ${o.boss.toUpperCase()}`);
    const hits=await ride(o,idx);
    const tries=await handover(o,idx,left);
    left=left.filter(n=>n!==o.lv);
    const st=tries===1?3:tries===2?2:1;S.stars[k]=st;S.tries[k]=tries;addStars();
    markDone(k);
    await stageClear(o,idx,st,!hits);
    closePanel();await sleep(350);
  }
  setSlots(5);setTarget(-1);moveMini(-1);
  await say('Semua paket terkirim, {p}! 🎉 Kelima atasan senang menerima paketnya.','jump');
  await say('Sebelum pulang, yuk lihat lagi arti 5 alasan tadi.','nod');
  await wipe(async()=>{hideBub()});
  debrief();
}
main().catch(e=>console.error(e));
})();
